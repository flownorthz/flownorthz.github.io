<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แปลงข้อความลืมเปลี่ยนภาษา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8C%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root{
    --deck:#1c2030;
    --deck-soft:#262b3d;
    --deck-line:#343b52;
    --keycap:#f7f3ea;
    --keycap-skirt:#cdc2a3;
    --ink:#20232e;
    --ink-soft:#666b7d;
    --amber:#ff8c42;
    --amber-dark:#d96e26;
    --teal:#2bb7a3;
    --teal-dark:#1f8f80;
    --radius:18px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family: 'Sukhumvit Set','Noto Sans Thai','Leelawadee UI','Segoe UI', system-ui, sans-serif;
    background:
      radial-gradient(circle at 1px 1px, var(--deck-line) 1px, transparent 1.4px) 0 0/26px 26px,
      var(--deck);
    color: var(--keycap);
    padding: 28px 16px 60px;
    display:flex;
    justify-content:center;
  }

  .stage{
    width:100%;
    max-width: 760px;
  }

  header{
    text-align:center;
    margin-bottom: 26px;
    animation: rise .5s ease both;
  }

  .eyebrow{
    font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px;
  }

  h1{
    font-size: clamp(1.5rem, 4.5vw, 2.1rem);
    margin: 0 0 8px;
    font-weight: 700;
    color: var(--keycap);
  }

  .sub{
    margin:0;
    color:#9ba1b4;
    font-size: 0.95rem;
    line-height:1.5;
  }

  .card{
    background: var(--deck-soft);
    border: 1px solid var(--deck-line);
    border-radius: 24px;
    padding: 22px;
    animation: rise .55s .05s ease both;
  }

  .control-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .badge{
    font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 0.74rem;
    letter-spacing: 0.04em;
    color:#aeb3c4;
    background: var(--deck);
    border:1px solid var(--deck-line);
    padding: 7px 12px;
    border-radius: 999px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition: color .15s ease, border-color .15s ease;
  }
  .badge i{ font-size: 0.78rem; }
  .badge.mode-eng{ color: var(--amber); border-color: rgba(255,140,66,.35); }
  .badge.mode-th{ color: var(--teal); border-color: rgba(43,183,163,.35); }

  /* The signature element: a literal dual-language keycap, like the real
     physical keys on a Thai keyboard (Latin letter top-left, Thai glyph
     bottom-right). Clicking it flips the conversion direction. */
  .mode-toggle{
    flex: 0 0 auto;
    width: 76px;
    height: 76px;
    border-radius: 16px;
    border: 1px solid var(--deck-line);
    background: linear-gradient(160deg, #2b3148, #1d2133);
    box-shadow: 0 6px 0 #11131c, 0 12px 20px rgba(0,0,0,.4);
    cursor:pointer;
    position:relative;
    padding: 9px;
    display:flex;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .mode-toggle:hover{ filter:brightness(1.08); }
  .mode-toggle:active{
    transform: translateY(5px);
    box-shadow: 0 1px 0 #11131c, 0 3px 8px rgba(0,0,0,.35);
  }
  .mode-toggle:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }
  .legend{
    position:absolute;
    font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-weight: 700;
    color:#5b6175;
    opacity:.45;
    transition: opacity .15s ease, color .15s ease, text-shadow .15s ease;
  }
  .legend-en{ top:9px; left:11px; font-size: 0.78rem; }
  .legend-th{ bottom:8px; right:10px; font-size: 0.86rem; }
  .legend.active.legend-en{ opacity:1; color: var(--amber); text-shadow: 0 0 12px rgba(255,140,66,.55); }
  .legend.active.legend-th{ opacity:1; color: var(--teal); text-shadow: 0 0 12px rgba(43,183,163,.55); }
  .legend-arrow{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 0.85rem;
    color:#3c4258;
  }

  .panels{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:stretch;
    gap: 12px;
  }

  .panel{
    background: var(--keycap);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 16px 16px 12px;
    box-shadow: 0 6px 0 var(--keycap-skirt), 0 14px 22px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }

  .panel label{
    font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  textarea{
    width:100%;
    height: 130px;
    resize: vertical;
    border: none;
    background: transparent;
    font-size: 1.05rem;
    line-height:1.55;
    color: var(--ink);
    font-family: inherit;
    padding:0;
  }
  textarea:focus{ outline:none; }
  textarea::placeholder{ color:#9b937c; }

  .panel-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .chip{
    border:none;
    background: rgba(32,35,46,.07);
    color: var(--ink);
    font-size: 0.78rem;
    padding: 6px 11px;
    border-radius: 999px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition: background .15s ease, transform .08s ease;
    font-family: inherit;
  }
  .chip:hover{ background: rgba(32,35,46,.14); }
  .chip:active{ transform: scale(.96); }

  .chip.copy{
    background: var(--ink);
    color: var(--keycap);
  }
  .chip.copy:hover{ background:#33384a; }
  .chip.copy.copied{ background: var(--teal-dark); color:white; }

  .swap-btn{
    align-self:center;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--deck-line);
    background: var(--deck);
    color:#c7cbdb;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .25s ease, background .15s ease, color .15s ease;
  }
  .swap-btn:hover{ color: var(--amber); border-color: rgba(255,140,66,.4); }
  .swap-btn:active{ transform: scale(.92) rotate(180deg); }
  .swap-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  footer{
    text-align:center;
    margin-top: 20px;
    font-size: 0.78rem;
    color:#6a6f81;
  }

  .toast{
    position: fixed;
    left:50%;
    bottom: 26px;
    transform: translate(-50%, 16px);
    background: var(--ink);
    color: var(--keycap);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .toast.show{ opacity:1; transform: translate(-50%, 0); }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (max-width: 600px){
    .panels{ grid-template-columns: 1fr; }
    .swap-btn{ justify-self:center; transform: rotate(90deg); }
    .swap-btn:active{ transform: scale(.92) rotate(270deg); }
    .control-row{ justify-content:center; text-align:center; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

  <div class="stage">
    <header>
      <p class="eyebrow">TH ⇄ EN key fix</p>
      <h1>แปลงข้อความที่ลืมเปลี่ยนภาษา</h1>
      <p class="sub">พิมพ์หรือวางข้อความที่เพี้ยน ระบบจะตรวจจับและแปลงให้อัตโนมัติ — หรือกดคีย์ด้านล่างเพื่อสลับทิศทางเอง</p>
    </header>

    <div class="card">
      <div class="control-row">
        <span class="badge" id="badge"><i class="fa-solid fa-wand-magic-sparkles"></i><span id="badgeText">พิมพ์อะไรสักอย่างเพื่อเริ่ม</span></span>

        <button class="mode-toggle" id="modeToggle" type="button" aria-pressed="false" aria-label="สลับทิศทางการแปลง">
          <span class="legend legend-en" id="legendEn">EN</span>
          <span class="legend legend-th" id="legendTh">ไทย</span>
          <span class="legend-arrow"><i class="fa-solid fa-right-left"></i></span>
        </button>
      </div>

      <div class="panels">
        <div class="panel">
          <label for="inputText">ข้อความเพี้ยน</label>
          <textarea id="inputText" placeholder="พิมพ์หรือวางข้อความตรงนี้..." autofocus></textarea>
          <div class="panel-actions">
            <button class="chip" id="clearBtn" type="button"><i class="fa-solid fa-eraser"></i> ล้าง</button>
            <button class="chip" id="exampleBtn" type="button"><i class="fa-solid fa-lightbulb"></i> ลองตัวอย่าง</button>
          </div>
        </div>

        <button class="swap-btn" id="swapBtn" type="button" aria-label="สลับข้อความและทิศทาง">
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </button>

        <div class="panel">
          <label for="outputText">ผลลัพธ์</label>
          <textarea id="outputText" placeholder="ผลลัพธ์จะปรากฏที่นี่..." readonly aria-live="polite"></textarea>
          <div class="panel-actions">
            <button class="chip copy" id="copyBtn" type="button"><i class="fa-solid fa-copy"></i> คัดลอก</button>
          </div>
        </div>
      </div>
    </div>

    <footer>Made by Overflow</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // --- Conversion tables (Thai Kedmanee key map) ---------------------------
    const engToThai = {
      'a': 'ฟ', 'b': 'ิ', 'c': 'แ', 'd': 'ก', 'e': 'ำ', 'f': 'ด',
      'g': 'เ', 'h': '้', 'i': 'ร', 'j': '่', 'k': 'า', 'l': 'ส',
      'm': 'ท', 'n': 'ื', 'o': 'น', 'p': 'ย', 'q': 'ๆ', 'r': 'พ',
      's': 'ห', 't': 'ะ', 'u': 'ี', 'v': 'อ', 'w': 'ไ', 'x': 'ป',
      'y': 'ั', 'z': 'ผ',
      'A': 'ฤ', 'B': 'ฺ', 'C': 'ฉ', 'D': 'ฏ', 'E': 'ฎ', 'F': 'โ',
      'G': 'ฌ', 'H': '็', 'I': 'ณ', 'J': '๋', 'K': 'ษ', 'L': 'ศ',
      'M': '?', 'N': '์', 'O': 'ฯ', 'P': 'ญ', 'Q': '๐', 'R': 'ฑ',
      'S': 'ฆ', 'T': 'ธ', 'U': '๊', 'V': 'ฮ', 'W': '"', 'X': ')',
      'Y': 'ํํํ', 'Z': '(',
      '`': '_', '1': 'ๅ', '2': '/', '3': '-', '4': 'ภ', '5': 'ถ',
      '6': 'ุ', '7': 'ึ', '8': 'ค', '9': 'ต', '0': 'จ', '-': 'ข',
      '=': 'ช', '[': 'บ', ']': 'ล', ';': 'ว', "'": 'ง', ',': 'ม',
      '.': 'ใ', '/': 'ฝ',
      '!': '+', '@': '๑', '#': '๒', '$': '๓', '%': '๔', '^': 'ู',
      '&': '฿', '*': '๕', '(': '๖', ')': '๗', '_': '๘', '+': '๙',
    };

    const thaiToEng = {};
    for (const key in engToThai) {
      thaiToEng[engToThai[key]] = key;
    }

    // --- State ----------------------------------------------------------------
    let currentMode = 'engToThai'; // 'engToThai' | 'thaiToEng'

    const inputEl = document.getElementById('inputText');
    const outputEl = document.getElementById('outputText');
    const toggleBtn = document.getElementById('modeToggle');
    const legendEn = document.getElementById('legendEn');
    const legendTh = document.getElementById('legendTh');
    const badge = document.getElementById('badge');
    const badgeText = document.getElementById('badgeText');
    const badgeIcon = badge.querySelector('i');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const exampleBtn = document.getElementById('exampleBtn');
    const toast = document.getElementById('toast');

    // --- Core conversion --------------------------------------------------
    function convert(text, mode) {
      const map = mode === 'engToThai' ? engToThai : thaiToEng;
      let out = '';
      for (const ch of text) out += map[ch] || ch;
      return out;
    }

    // Guess direction from which script dominates the typed text.
    function detectMode(text) {
      const thaiCount = (text.match(/[\u0E01-\u0E5B]/g) || []).length;
      const latinCount = (text.match(/[A-Za-z]/g) || []).length;
      if (thaiCount === 0 && latinCount === 0) return null;
      if (thaiCount > latinCount) return 'thaiToEng';
      if (latinCount > thaiCount) return 'engToThai';
      return null;
    }

    function updateToggleUI() {
      const isEng = currentMode === 'engToThai';
      toggleBtn.setAttribute('aria-pressed', String(!isEng));
      legendEn.classList.toggle('active', isEng);
      legendTh.classList.toggle('active', !isEng);
    }

    function updateBadge(autoDetected) {
      badge.classList.remove('mode-eng', 'mode-th');
      if (inputEl.value.trim() === '') {
        badgeIcon.className = 'fa-solid fa-wand-magic-sparkles';
        badgeText.textContent = 'พิมพ์อะไรสักอย่างเพื่อเริ่ม';
        return;
      }
      const isEng = currentMode === 'engToThai';
      badge.classList.add(isEng ? 'mode-eng' : 'mode-th');
      badgeIcon.className = autoDetected ? 'fa-solid fa-wand-magic-sparkles' : 'fa-solid fa-hand-pointer';
      const direction = isEng ? 'Eng → ไทย' : 'ไทย → Eng';
      badgeText.textContent = (autoDetected ? 'ตรวจพบอัตโนมัติ: ' : 'เลือกเอง: ') + direction;
    }

    function renderFrom(text, { auto = true } = {}) {
      let autoDetected = false;
      if (auto) {
        const detected = detectMode(text);
        if (detected) {
          currentMode = detected;
          autoDetected = true;
        }
      }
      outputEl.value = text.trim() === '' ? '' : convert(text, currentMode);
      updateToggleUI();
      updateBadge(autoDetected);
    }

    // --- Events -----------------------------------------------------------
    inputEl.addEventListener('input', () => renderFrom(inputEl.value, { auto: true }));

    toggleBtn.addEventListener('click', () => {
      currentMode = currentMode === 'engToThai' ? 'thaiToEng' : 'engToThai';
      renderFrom(inputEl.value, { auto: false });
    });

    swapBtn.addEventListener('click', () => {
      const newInput = outputEl.value;
      if (!newInput) return;
      currentMode = currentMode === 'engToThai' ? 'thaiToEng' : 'engToThai';
      inputEl.value = newInput;
      renderFrom(newInput, { auto: false });
      inputEl.focus();
    });

    clearBtn.addEventListener('click', () => {
      inputEl.value = '';
      outputEl.value = '';
      updateBadge(false);
      inputEl.focus();
    });

    const examples = ['l;ylfu', '้ำสสน'];
    let exampleIndex = 0;
    exampleBtn.addEventListener('click', () => {
      inputEl.value = examples[exampleIndex % examples.length];
      exampleIndex++;
      renderFrom(inputEl.value, { auto: true });
    });

    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    copyBtn.addEventListener('click', async () => {
      const text = outputEl.value;
      if (!text) { showToast('ยังไม่มีผลลัพธ์ให้คัดลอก'); return; }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          outputEl.removeAttribute('readonly');
          outputEl.select();
          document.execCommand('copy');
          outputEl.setAttribute('readonly', 'true');
        }
        copyBtn.classList.add('copied');
        showToast('คัดลอกแล้ว');
        setTimeout(() => copyBtn.classList.remove('copied'), 1200);
      } catch (err) {
        showToast('คัดลอกไม่สำเร็จ ลองเลือกข้อความเอง');
      }
    });

    // --- Init ---------------------------------------------------------------
    updateToggleUI();
    updateBadge(false);
  </script>

</body>
</html>
