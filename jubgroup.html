<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jubgroup</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, "Noto Sans Thai", sans-serif;
        background: #f3f4f6;
        color: #222;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 30px 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    /* Control */
    .controls {
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,.08);
        margin-bottom: 20px;
    }

    .control-row {
        display: flex;
        gap: 15px;
        align-items: end;
        flex-wrap: wrap;
    }

    .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    label {
        font-weight: bold;
    }

    input {
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        width: 180px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
        transition: .2s;
    }

    button:hover {
        transform: translateY(-1px);
        opacity: .9;
    }

    .btn-blue {
        background: #2563eb;
        color: white;
    }

    .btn-green {
        background: #16a34a;
        color: white;
    }

    .btn-orange {
        background: #f59e0b;
        color: white;
    }

    .btn-gray {
        background: #6b7280;
        color: white;
    }

    .btn-red {
        background: #dc2626;
        color: white;
    }

    /* Stats */
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }

    .stat {
        background: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .stat-number {
        font-size: 32px;
        font-weight: bold;
        margin-top: 5px;
    }

    /* Layout */
    .workspace {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 20px;
        align-items: start;
    }

    .panel {
        background: white;
        border-radius: 15px;
        padding: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .panel h2 {
        margin-top: 0;
        font-size: 20px;
    }

    /* Names */
    .names-list {
        min-height: 100px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .name {
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        padding: 10px 12px;
        border-radius: 9px;
        cursor: grab;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
    }

    .name:active {
        cursor: grabbing;
    }

    .name button {
        padding: 3px 7px;
        font-size: 12px;
        background: #ef4444;
        color: white;
    }

    /* Groups */
    .groups {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
    }

    .group {
        background: #f9fafb;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        min-height: 180px;
        padding: 12px;
        transition: .2s;
    }

    .group.drag-over {
        border-color: #2563eb;
        background: #eff6ff;
    }

    .group-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #ddd;
    }

    .group-title {
        font-weight: bold;
        font-size: 18px;
    }

    .count {
        font-size: 13px;
        background: #e5e7eb;
        padding: 4px 8px;
        border-radius: 20px;
    }

    .group-members {
        min-height: 120px;
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .empty {
        color: #999;
        text-align: center;
        padding: 30px 5px;
        font-size: 14px;
    }

    .warning {
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #fff7ed;
        color: #9a3412;
        display: none;
    }

    .success {
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #f0fdf4;
        color: #166534;
        display: none;
    }

    @media (max-width: 800px) {
        .workspace {
            grid-template-columns: 1fr;
        }

        .stats {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>

<body>

<div class="container">

```
<h1>👥 ระบบจัดแบ่งกลุ่ม</h1>
<div class="subtitle">
    ลากชื่อไปใส่กลุ่มที่ต้องการได้เลย
</div>

<!-- Controls -->
<div class="controls">

    <div class="control-row">

        <div class="input-group">
            <label>สมาชิกต่อกลุ่ม</label>
            <input
                type="number"
                id="membersPerGroup"
                value="4"
                min="1"
                oninput="updateGroups()"
            >
        </div>

        <div class="input-group">
            <label>เพิ่มชื่อ</label>
            <input
                type="text"
                id="newName"
                placeholder="เช่น มาร์ค"
                onkeydown="handleEnter(event)"
            >
        </div>

        <button class="btn-blue" onclick="addName()">
            + เพิ่มชื่อ
        </button>

        <button class="btn-green" onclick="randomizeGroups()">
            🎲 สุ่มแบ่งกลุ่ม
        </button>

        <button class="btn-gray" onclick="resetGroups()">
            ↻ รีเซ็ต
        </button>

    </div>

    <div id="warning" class="warning"></div>
    <div id="success" class="success"></div>

</div>

<!-- Stats -->
<div class="stats">

    <div class="stat">
        <div>จำนวนคนทั้งหมด</div>
        <div class="stat-number" id="totalPeople">20</div>
    </div>

    <div class="stat">
        <div>จำนวนสมาชิก / กลุ่ม</div>
        <div class="stat-number" id="perGroup">4</div>
    </div>

    <div class="stat">
        <div>จำนวนกลุ่ม</div>
        <div class="stat-number" id="totalGroups">5</div>
    </div>

</div>

<!-- Workspace -->
<div class="workspace">

    <!-- Names -->
    <div class="panel">

        <h2>📋 รายชื่อ</h2>

        <div
            id="namesList"
            class="names-list"
            ondragover="allowDrop(event)"
            ondrop="dropToNames(event)"
        ></div>

    </div>

    <!-- Groups -->
    <div class="panel">

        <h2>👥 กลุ่ม</h2>

        <div id="groups" class="groups"></div>

    </div>

</div>
```

</div>

<script>

let names = [
    "ปั้น",
    "นิว",
    "พรีม",
    "ริว",
    "แชมมี่",
    "นล",
    "ปาร์ค",
    "แก๊ง",
    "นุ้ย",
    "เป๊ก",
    "เกิ้ล",
    "ไอวี่",
    "ลูกแพร",
    "โต้",
    "บลู",
    "ข้าว",
    "เน่",
    "เฟิร์ส",
    "เกม"
];

let groups = [];

let draggedName = null;
let draggedFrom = null;


/* =========================
   INITIALIZE
========================= */

function init() {
    updateGroups();
}


/* =========================
   CALCULATE GROUPS
========================= */

function updateGroups() {

    const perGroup =
        parseInt(document.getElementById("membersPerGroup").value) || 1;

    const total = names.length;

    const groupCount = Math.ceil(total / perGroup);

    document.getElementById("totalPeople").textContent = total;
    document.getElementById("perGroup").textContent = perGroup;
    document.getElementById("totalGroups").textContent = groupCount;

    /*
        ถ้าจำนวนกลุ่มเปลี่ยน
        สร้างกลุ่มใหม่ แต่พยายามรักษาชื่อเดิม
    */

    while (groups.length < groupCount) {
        groups.push([]);
    }

    while (groups.length > groupCount) {

        const removed = groups.pop();

        /*
            ถ้าลดจำนวนกลุ่ม
            เอาคนในกลุ่มที่ถูกลบกลับไปยังรายชื่อ
        */

        if (removed) {
            names.push(...removed);
        }
    }

    render();
    showCalculation();
}


/* =========================
   RENDER
========================= */

function render() {

    renderNames();
    renderGroups();

    document.getElementById("totalPeople").textContent =
        names.length + groups.reduce((sum, group) => sum + group.length, 0);
}


/* =========================
   RENDER NAMES
========================= */

function renderNames() {

    const container = document.getElementById("namesList");

    container.innerHTML = "";

    if (names.length === 0) {

        container.innerHTML =
            `<div class="empty">
                ไม่มีชื่อเหลือ<br>
                ลากชื่อจากกลุ่มกลับมาที่นี่ได้
            </div>`;

        return;
    }

    names.forEach((name, index) => {

        const div = document.createElement("div");

        div.className = "name";

        div.draggable = true;

        div.innerHTML = `
            <span>${escapeHTML(name)}</span>
            <button onclick="removeName(${index})">ลบ</button>
        `;

        div.addEventListener("dragstart", () => {
            draggedName = name;
            draggedFrom = "names";
        });

        container.appendChild(div);
    });
}


/* =========================
   RENDER GROUPS
========================= */

function renderGroups() {

    const container = document.getElementById("groups");

    container.innerHTML = "";

    const perGroup =
        parseInt(document.getElementById("membersPerGroup").value) || 1;

    groups.forEach((group, groupIndex) => {

        const groupDiv = document.createElement("div");

        groupDiv.className = "group";

        groupDiv.addEventListener("dragover", allowDrop);

        groupDiv.addEventListener("dragenter", () => {
            groupDiv.classList.add("drag-over");
        });

        groupDiv.addEventListener("dragleave", () => {
            groupDiv.classList.remove("drag-over");
        });

        groupDiv.addEventListener("drop", (event) => {

            groupDiv.classList.remove("drag-over");

            dropToGroup(event, groupIndex);
        });

        const header = document.createElement("div");

        header.className = "group-header";

        header.innerHTML = `
            <div class="group-title">
                กลุ่ม ${groupIndex + 1}
            </div>

            <div class="count">
                ${group.length} / ${perGroup}
            </div>
        `;

        groupDiv.appendChild(header);

        const members = document.createElement("div");

        members.className = "group-members";

        if (group.length === 0) {

            members.innerHTML =
                `<div class="empty">
                    ลากชื่อมาวางที่นี่
                </div>`;

        } else {

            group.forEach((name, nameIndex) => {

                const div = document.createElement("div");

                div.className = "name";

                div.draggable = true;

                div.innerHTML = `
                    <span>${escapeHTML(name)}</span>
                    <button onclick="removeFromGroup(${groupIndex}, ${nameIndex})">
                        ↩
                    </button>
                `;

                div.addEventListener("dragstart", () => {

                    draggedName = name;

                    draggedFrom = {
                        type: "group",
                        index: groupIndex
                    };

                });

                members.appendChild(div);
            });
        }

        groupDiv.appendChild(members);

        container.appendChild(groupDiv);
    });
}


/* =========================
   DRAG & DROP
========================= */

function allowDrop(event) {
    event.preventDefault();
}


function dropToGroup(event, groupIndex) {

    event.preventDefault();

    if (!draggedName) return;

    const perGroup =
        parseInt(document.getElementById("membersPerGroup").value) || 1;

    /*
        เช็กว่ากลุ่มเต็มหรือยัง
    */

    if (groups[groupIndex].length >= perGroup) {

        showWarning(
            `กลุ่ม ${groupIndex + 1} เต็มแล้ว (${perGroup} คน)`
        );

        draggedName = null;

        return;
    }


    /*
        ลบชื่อจากตำแหน่งเดิม
    */

    if (draggedFrom === "names") {

        const index = names.indexOf(draggedName);

        if (index !== -1) {
            names.splice(index, 1);
        }

    } else if (draggedFrom.type === "group") {

        const oldGroup = groups[draggedFrom.index];

        const index = oldGroup.indexOf(draggedName);

        if (index !== -1) {
            oldGroup.splice(index, 1);
        }
    }


    /*
        เพิ่มเข้า Group ใหม่
    */

    groups[groupIndex].push(draggedName);

    draggedName = null;
    draggedFrom = null;

    render();

    showSuccess(
        `${draggedName || "สมาชิก"} ถูกย้ายเข้ากลุ่มแล้ว`
    );
}


function dropToNames(event) {

    event.preventDefault();

    if (!draggedName) return;

    /*
        ลบจากกลุ่มเดิม
    */

    if (draggedFrom !== "names") {

        const oldGroup = groups[draggedFrom.index];

        const index = oldGroup.indexOf(draggedName);

        if (index !== -1) {
            oldGroup.splice(index, 1);
        }

        names.push(draggedName);
    }

    draggedName = null;
    draggedFrom = null;

    render();
}


/* =========================
   ADD NAME
========================= */

function addName() {

    const input = document.getElementById("newName");

    const name = input.value.trim();

    if (!name) return;

    /*
        ป้องกันชื่อซ้ำ
    */

    const allNames = [
        ...names,
        ...groups.flat()
    ];

    if (allNames.includes(name)) {

        showWarning("มีชื่อนี้อยู่แล้ว");

        return;
    }

    names.push(name);

    input.value = "";

    updateGroups();
}


/* =========================
   ENTER TO ADD
========================= */

function handleEnter(event) {

    if (event.key === "Enter") {
        addName();
    }
}


/* =========================
   REMOVE NAME
========================= */

function removeName(index) {

    if (!confirm(`ต้องการลบ "${names[index]}" หรือไม่?`)) {
        return;
    }

    names.splice(index, 1);

    updateGroups();
}


function removeFromGroup(groupIndex, nameIndex) {

    const name = groups[groupIndex][nameIndex];

    groups[groupIndex].splice(nameIndex, 1);

    names.push(name);

    render();
}


/* =========================
   RANDOM GROUP
========================= */

function randomizeGroups() {

    const allPeople = [
        ...names,
        ...groups.flat()
    ];

    const perGroup =
        parseInt(document.getElementById("membersPerGroup").value) || 1;

    /*
        Shuffle
    */

    for (let i = allPeople.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [allPeople[i], allPeople[j]] =
        [allPeople[j], allPeople[i]];
    }


    /*
        Clear
    */

    names = [];

    groups = [];

    const groupCount =
        Math.ceil(allPeople.length / perGroup);

    for (let i = 0; i < groupCount; i++) {

        groups.push(
            allPeople.slice(
                i * perGroup,
                (i + 1) * perGroup
            )
        );
    }

    render();

    showSuccess("สุ่มแบ่งกลุ่มเรียบร้อย 🎲");
}


/* =========================
   RESET
========================= */

function resetGroups() {

    const allPeople = [
        ...names,
        ...groups.flat()
    ];

    names = [...allPeople];

    groups = [];

    updateGroups();

    showSuccess("รีเซ็ตเรียบร้อย");
}


/* =========================
   CALCULATION MESSAGE
========================= */

function showCalculation() {

    const perGroup =
        parseInt(document.getElementById("membersPerGroup").value) || 1;

    const total =
        names.length +
        groups.reduce(
            (sum, group) => sum + group.length,
            0
        );

    const fullGroups =
        Math.floor(total / perGroup);

    const remaining =
        total % perGroup;

    const warning =
        document.getElementById("warning");

    if (remaining > 0) {

        warning.style.display = "block";

        warning.textContent =
            `มี ${total} คน → แบ่งกลุ่มละ ${perGroup} คน ` +
            `จะได้ ${fullGroups} กลุ่มเต็ม ` +
            `และเหลือ ${remaining} คน`;

    } else {

        warning.style.display = "none";
    }
}


/* =========================
   MESSAGES
========================= */

function showWarning(message) {

    const warning =
        document.getElementById("warning");

    warning.textContent = message;

    warning.style.display = "block";

    setTimeout(() => {

        warning.style.display = "none";

    }, 2500);
}


function showSuccess(message) {

    const success =
        document.getElementById("success");

    success.textContent = message;

    success.style.display = "block";

    setTimeout(() => {

        success.style.display = "none";

    }, 2000);
}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
