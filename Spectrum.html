<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Made by Overflow</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ac:#a855f7;--ac2:#c084fc;--pn:rgba(24,12,42,.84)}
  html,body{height:100%;margin:0;overflow:hidden;background:#150d26;color:#ece8f6;font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif}
  #stage{position:fixed;top:0;left:0;bottom:0;right:320px;transition:right .3s}
  #cv{width:100%;height:100%;display:block}
  #side{position:fixed;top:0;right:0;bottom:0;width:320px;z-index:30;background:var(--pn);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid rgba(192,132,252,.15);overflow-y:auto;transition:transform .3s;padding:0 18px 24px}
  #player{position:fixed;left:16px;right:336px;bottom:16px;z-index:20;transition:transform .3s,right .3s;background:var(--pn);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(192,132,252,.18);border-radius:16px;padding:12px 16px}
  .hide-ui #side{transform:translateX(100%)}
  .hide-ui #stage{right:0}
  .hide-ui #player{transform:translateY(130%);right:16px}
  @media(max-width:767px){#stage{right:0}#player{right:16px}#side{width:min(320px,88vw)}}
  #toggleUi{position:fixed;top:12px;right:12px;z-index:40;transition:opacity .3s}
  .hide-ui #toggleUi{opacity:.3}.hide-ui #toggleUi:hover,.hide-ui #toggleUi:focus-visible{opacity:1}
  .hidden{display:none!important}
  .sec{border-top:1px solid rgba(192,132,252,.14);padding:14px 0}
  .sec>summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:'+';color:#9b8bb8;font-weight:400}
  .sec[open]>summary::after{content:'–'}
  .row{display:grid;grid-template-columns:1fr auto;gap:6px 8px;font-size:12px;color:#b9aed2;margin-top:12px;align-items:center}
  .row output{color:#ece8f6;font-variant-numeric:tabular-nums}
  .row>input[type=range],.row>input[type=text]{grid-column:1/3}
  .seg{display:flex;background:#0e0818;border-radius:10px;padding:3px;gap:2px;margin-top:12px}
  .seg button{flex:1;padding:7px 4px;font-size:12px;border-radius:8px;color:#b9aed2;transition:background .15s}
  .seg button.on{background:var(--ac);color:#fff;font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:#34254f;border-radius:4px;width:100%}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ac2);border:0;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ac2);border:0;cursor:pointer}
  input[type=color]{width:38px;height:26px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:none;padding:0;cursor:pointer}
  input[type=text]{background:#0e0818;border:1px solid rgba(192,132,252,.25);border-radius:8px;color:#ece8f6;padding:6px 10px;font-size:13px;width:100%}
  select{background:#0e0818;border:1px solid rgba(192,132,252,.25);border-radius:8px;color:#ece8f6;padding:5px 8px;font-size:12px}
  input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px}
  .btn{background:#2a1c45;border:1px solid rgba(192,132,252,.2);color:#ece8f6;border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer;transition:background .15s}
  .btn:hover{background:#3a2862}
  .btn.main{background:var(--ac);color:#fff;font-weight:600;border:0}
  .btn.main:hover{background:#b872ff}
  .btn.rec{background:#ff4fa3;color:#fff;font-weight:600;border:0}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
  .preset{width:100%;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.12);cursor:pointer}
  .sub{font-size:11px;color:#9b8bb8;margin-top:16px}
  #drop{position:fixed;inset:12px;z-index:50;border:2px dashed var(--ac2);border-radius:24px;background:rgba(168,85,247,.12);display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:none}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;background:#2a1520;border:1px solid #ff4fa3;color:#ffd5e8;padding:10px 16px;border-radius:12px;font-size:13px}
  .eq{display:flex;gap:6px;height:72px;align-items:flex-end}
  .eq i{width:9px;height:100%;border-radius:5px;background:linear-gradient(#c084fc,#7c3aed);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite;animation-delay:var(--d)}
  @keyframes eq{0%,100%{transform:scaleY(.18)}50%{transform:scaleY(1)}}
  .zone{position:relative;padding:34px 40px;border-radius:28px;border:2px dashed rgba(192,132,252,.45);animation:zone 3s ease-in-out infinite,floaty 4s ease-in-out infinite}
  @keyframes zone{0%,100%{background:rgba(168,85,247,.04);border-color:rgba(192,132,252,.3)}50%{background:rgba(168,85,247,.12);border-color:rgba(192,132,252,.8)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .glow{animation:glow 2s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,.55)}50%{box-shadow:0 0 0 12px rgba(168,85,247,0)}}
  .card{background:#1a0f2e;border:1px solid rgba(192,132,252,.3);border-radius:20px;padding:28px 36px;min-width:280px;text-align:center}
  .wf{width:min(420px,92vw);text-align:left;padding:26px 28px}
  .wf-steps{display:flex;align-items:flex-start;margin:20px 0 6px}
  .wf-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;color:#6f628c;text-align:center}
  .wf-step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:#34254f}
  .wf-step.done:not(:last-child)::after{background:#a855f7}
  .wf-dot{width:26px;height:26px;border-radius:50%;border:2px solid #34254f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#1a0f2e;position:relative;z-index:1}
  .wf-step.on{color:#ece8f6}
  .wf-step.on .wf-dot{border-color:#c084fc;color:#fff;box-shadow:0 0 0 5px rgba(168,85,247,.25);animation:glow 1.6s ease-in-out infinite}
  .wf-step.done{color:#c9bde0}
  .wf-step.done .wf-dot{background:#a855f7;border-color:#a855f7;color:#fff}
  .wf-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 18px}
  .wf-meta div{background:#0e0818;border-radius:10px;padding:8px 10px}
  .wf-meta small{display:block;font-size:10px;color:#9b8bb8}
  .wf-meta b{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:#34254f;border-radius:8px;overflow:hidden;margin:16px 0}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#c084fc);transition:width .3s}
</style>
</head>
<body class="">
<div id="bg" class="fixed inset-0 z-0" style="background:#150d26">
  <div id="bgi" class="absolute inset-0 bg-cover bg-center"></div>
</div>

<div id="stage" class="z-10">
  <canvas id="cv"></canvas>
  <div id="empty" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6" style="padding-bottom:90px">
    <div class="zone flex flex-col items-center gap-3">
      <div class="eq" aria-hidden="true"><i style="--d:0s"></i><i style="--d:.15s"></i><i style="--d:.3s"></i><i style="--d:.45s"></i><i style="--d:.6s"></i><i style="--d:.3s"></i><i style="--d:.15s"></i></div>
      <p class="text-lg font-medium mt-2">ลากไฟล์ .mp3 หรือ .wav มาวางที่นี่</p>
      <p class="text-sm text-slate-400">หรือเลือกไฟล์จากเครื่องของคุณ</p>
      <button class="btn main glow" id="pickBtn" style="padding:10px 22px;font-size:13px">เลือกไฟล์เสียง</button>
    </div>
  </div>
</div>

<div id="player">
  <div class="flex items-center gap-3">
    <button id="playBtn" class="btn main !rounded-full" style="width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center" aria-label="เล่น/หยุดชั่วคราว">
      <svg id="icPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg id="icPause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="flex-1 min-w-0">
      <div id="track" class="text-xs text-slate-400 truncate mb-1">ยังไม่ได้เลือกไฟล์</div>
      <div class="flex items-center gap-2 text-xs tabular-nums text-slate-300">
        <span id="cur" class="w-10 text-right">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="ตำแหน่งเพลง">
        <span id="dur" class="w-10">0:00</span>
      </div>
    </div>
    <button class="btn expBtn whitespace-nowrap hidden sm:block">ส่งออกวิดีโอ</button>
    <div class="flex items-center gap-2 w-28 sm:w-32" title="เสียงที่ได้ยินในเบราว์เซอร์ (ไม่มีผลกับไฟล์ที่ส่งออก)">
      <button id="muteBtn" class="shrink-0" aria-label="ปิด/เปิดเสียง" style="color:#c9bde0;line-height:0"></button>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="ระดับเสียงมอนิเตอร์">
    </div>
  </div>
</div>

<button id="toggleUi" class="btn" title="ซ่อน/แสดงแผงควบคุม (H)">ซ่อน UI</button>

<aside id="side">
  <div class="pt-5 pb-4">
    <h1 class="text-xl font-semibold" style="letter-spacing:.01em;color:#d8b4fe">Spectrum</h1>
    <p class="text-xs text-slate-400">Made by Overflow</p>
  </div>
  <div id="panel"></div>
</aside>

<div id="drop" class="hidden">วางไฟล์เสียงเพื่อเล่น</div>
<div id="toast" class="hidden" role="alert"></div>
<div id="expOv" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(12,6,22,.8);backdrop-filter:blur(6px)" role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <div class="card wf">
    <div class="flex items-baseline justify-between gap-3">
      <h2 id="expTitle" class="text-base font-semibold" style="color:#d8b4fe">ส่งออกวิดีโอ MP4</h2>
      <span id="expInfo" class="text-xs text-slate-400 truncate"></span>
    </div>
    <div class="wf-steps" aria-hidden="true">
      <div class="wf-step" data-s="0"><span class="wf-dot">1</span>เตรียมไฟล์</div>
      <div class="wf-step" data-s="1"><span class="wf-dot">2</span>เรนเดอร์</div>
      <div class="wf-step" data-s="2"><span class="wf-dot">3</span>บันทึกไฟล์</div>
    </div>
    <div class="text-center">
      <div id="expPct" class="text-5xl font-semibold mt-3" style="color:#d8b4fe">0%</div>
      <div class="bar"><i id="expBar"></i></div>
    </div>
    <div class="wf-meta">
      <div><small>ผ่านไป</small><b id="expEl">0:00</b></div>
      <div><small>เหลือประมาณ</small><b id="expEta">–</b></div>
      <div><small>ความยาวเพลง</small><b id="expLen">–</b></div>
    </div>
    <p id="expMsg" class="text-xs text-slate-400 mb-4 text-center">กรุณาเปิดแท็บนี้ค้างไว้ และไม่เปลี่ยนไปแท็บอื่น</p>
    <div class="text-center"><button class="btn rec" id="expCancel">ยกเลิก</button></div>
  </div>
</div>

<input id="fAudio" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav,audio/x-wav" class="hidden">
<input id="fBg" type="file" accept="image/*" class="hidden">
<input id="fLogo" type="file" accept="image/*" class="hidden">
<audio id="audio" preload="auto"></audio>

<script>
(()=>{
const $=id=>document.getElementById(id);
const S={shape:'bars',pos:'bottom',mirror:true,cmode:'gradient',c1:'#00e5c3',c2:'#5b7cff',c3:'#ff4fa3',useC3:true,glow:18,
  fft:2048,bars:96,bw:8,gap:4,bh:100,smooth:.8,gain:1.2,beat:true,beatAmt:60,inner:22,spin:false,bgColor:'#150d26',dim:35,blur:0,expRes:720,
  txOn:true,txt:'Made by Overflow',tcolor:'#ffffff',tsize:48,tx:50,ty:16,tScroll:false,tGrad:false,tBlink:false,tBounce:true,tspeed:4,tbounce:50,
  bDef:true,bSnare:false,bKick:false,bBpm:false,bpm:120};

/* ---------- UI builder ---------- */
const seg=(k,o)=>`<div class="seg" data-key="${k}">${o.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('')}</div>`;
const rng=(k,l,a,b,s,u='')=>`<label class="row"><span>${l}</span><output data-out="${k}" data-u="${u}"></output><input type="range" data-key="${k}" min="${a}" max="${b}" step="${s}"></label>`;
const chk=(k,l,x='')=>`<label class="row inline" ${x}><span>${l}</span><input type="checkbox" data-key="${k}"></label>`;
const col=(k,l,x='')=>`<label class="row inline" ${x}><span>${l}</span><input type="color" data-key="${k}"></label>`;
const sel=(k,l,o,x='')=>`<label class="row inline" ${x}><span>${l}</span><select data-key="${k}">${o.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`;
const sec=(t,b,open=true)=>`<details class="sec" ${open?'open':''}><summary>${t}</summary>${b}</details>`;
const presets=[['#00e5c3','#5b7cff','#ff4fa3'],['#ff9a3c','#ff3c6e','#7b2cff'],['#9dff6b','#1fd1a5','#2a7bff'],['#ffffff','#9fb4ff','#ffb3e6']];

$('panel').innerHTML=
 sec('รูปแบบ Visualizer',
  seg('shape',[['bars','แท่งกราฟ'],['circle','วงกลม'],['wave','เส้นคลื่น']])+
  sel('pos','ตำแหน่ง',[['bottom','ด้านล่าง'],['center','กึ่งกลางจอ']],'data-for="bars wave"')+
  chk('mirror','สมมาตรซ้าย-ขวา'))+
 sec('สีและ Glow',
  seg('cmode',[['solid','สีเดี่ยว'],['gradient','ไล่เฉดสี']])+
  col('c1','สีที่ 1')+col('c2','สีที่ 2','data-grad')+chk('useC3','ใช้สีที่ 3','data-grad')+col('c3','สีที่ 3','data-grad data-c3')+
  `<div class="grid grid-cols-4 gap-2 mt-3" data-grad>${presets.map((p,i)=>`<button class="preset" data-preset="${i}" aria-label="ชุดสี ${i+1}" style="background:linear-gradient(90deg,${p.join(',')})"></button>`).join('')}</div>`+
  rng('glow','ความฟุ้ง (Glow)',0,50,1))+
 sec('ความละเอียดและขนาดแท่ง',
  sel('fft','FFT Size',[[256,'256'],[512,'512'],[1024,'1024'],[2048,'2048'],[4096,'4096'],[8192,'8192']])+
  rng('bars','จำนวนแท่ง',16,256,2)+
  rng('bw','ความกว้างแท่ง / ความหนาเส้น',1,40,1,'px')+
  rng('bh','ความสูงแท่ง (สูงสุด)',20,150,1,'%')+
  rng('gap','ระยะห่างแท่ง',0,30,1,'px')+
  rng('smooth','ความสมูท (Smoothing)',0,.95,.01)+
  rng('gain','ความไวเสียง (Gain)',.5,2.5,.05))+
 sec('โหมดวงกลม',
  `<div data-for="circle">`+chk('beat','วงกลมขยายตามเบส (Beat)')+rng('beatAmt','ความแรงของ Beat',0,100,1,'%')+
  rng('inner','ขนาดวงกลมตรงกลาง',10,40,1,'%')+chk('spin','หมุนวงกลมช้าๆ')+
  `<div class="flex gap-2 mt-3"><button class="btn flex-1" id="logoBtn">อัปโหลดโลโก้/ปก</button><button class="btn" id="logoDel">ลบ</button></div></div>`+
  `<p class="text-xs text-slate-500 mt-3" data-for="bars wave">ตัวเลือกนี้ใช้ได้เมื่อเลือกรูปแบบวงกลม</p>`,false)+
 sec('ข้อความ (Custom Text)',
  chk('txOn','แสดงข้อความ')+
  `<label class="row"><span>ข้อความ</span><input type="text" data-key="txt" maxlength="120" placeholder="พิมพ์ข้อความ…"></label>`+
  col('tcolor','สีข้อความ')+
  rng('tsize','ขนาดตัวอักษร',12,200,1,'px')+
  rng('tx','ตำแหน่งแนวนอน (ซ้าย → ขวา)',0,100,1,'%')+
  rng('ty','ตำแหน่งแนวตั้ง (บน → ล่าง)',0,100,1,'%')+
  `<p class="sub">เอฟเฟกต์ (ติ๊กรวมกันได้)</p>`+
  chk('tScroll','เลื่อนข้อความ (Scroll)')+
  chk('tGrad','ไล่เฉดสีวิ่ง')+
  chk('tBlink','กระพริบ')+
  chk('tBounce','เด้งตามจังหวะ')+
  rng('tspeed','ความเร็ว Scroll',1,20,1)+
  rng('tbounce','ความแรงการเด้ง (เบา → แรง)',0,100,1,'%')+
  `<p class="sub">จังหวะที่ใช้เด้ง (ติ๊กได้หลายอัน)</p>`+
  chk('bDef','Default (ระดับเสียงรวม)')+
  chk('bSnare','Snare')+
  chk('bKick','Kick / Bass')+
  chk('bBpm','BPM (จังหวะคงที่)')+
  rng('bpm','BPM',40,220,1))+
 sec('พื้นหลัง',
  col('bgColor','สีพื้นหลัง')+
  `<div class="flex gap-2 mt-3"><button class="btn flex-1" id="bgBtn">อัปโหลดรูปพื้นหลัง</button><button class="btn" id="bgDel">ลบ</button></div>`+
  rng('dim','ความมืด (Overlay Dim)',0,90,1,'%')+rng('blur','ความเบลอ (Blur)',0,30,1,'px'),false)+
 sec('ส่งออกวิดีโอ',
  `<label class="row"><span>ชื่อไฟล์</span><input type="text" id="exName" maxlength="80" placeholder="spectrum"></label>`+
  sel('expRes','ความละเอียด',[[720,'720p (1280×720)'],[1080,'1080p (1920×1080)']])+
  `<button class="btn rec expBtn w-full mt-3">ส่งออกเป็น MP4</button>`+
  `<p id="expStat" class="text-xs text-slate-400 mt-3">ระหว่างส่งออกจะไม่มีเสียงออกลำโพง แสดงความคืบหน้าเป็น % (ใช้เวลาเท่าความยาวเพลง) กรุณาเปิดแท็บนี้ค้างไว้</p>`)+
 `<p class="text-xs text-slate-500 mt-4">ปุ่มลัด: Space เล่น/หยุด · H ซ่อน/แสดงแผงควบคุม</p>`;

/* ---------- state sync ---------- */
let stops=[],analyser=null,ac=null,outGain=null,adest=null,freq=new Uint8Array(1024),bgUrl=null,bgImg=null,logo=null,logoUrl=null,volV=.8,muted=false;
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function refresh(){
  stops=[hex(S.c1),hex(S.c2)]; if(S.useC3)stops.push(hex(S.c3));
  if(analyser){ if(analyser.fftSize!==S.fft){analyser.fftSize=S.fft;freq=new Uint8Array(analyser.frequencyBinCount)} analyser.smoothingTimeConstant=S.smooth }
  $('bg').style.backgroundColor=S.bgColor;
  $('bgi').style.filter=`blur(${S.blur}px) brightness(${1-S.dim/100})`;
  $('bgi').style.transform=`scale(${1+S.blur/80})`;
}
function sync(){
  document.querySelectorAll('[data-key]').forEach(e=>{
    const k=e.dataset.key,v=S[k];
    if(e.classList.contains('seg'))e.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(v)));
    else if(e.type==='checkbox')e.checked=v; else if(e.value!==String(v))e.value=v;
  });

let exC=null,exG=null,exCancel=false,exTimer=0;
const EXW=1280,EXH=720;

function pickMime(){

/* --- fallback: MediaRecorder (ไฟล์อาจเลื่อนไม่ได้) --- */
function startExportMR(){
  if(!audio.getAttribute('src')){toast('กรุณาเลือกไฟล์เสียงก่อนส่งออก');return}
  if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream){toast('เบราว์เซอร์นี้ไม่รองรับการส่งออกวิดีโอ');return}
  initAudio();
  const mime=pickMime();if(!mime){toast('เบราว์เซอร์นี้ไม่รองรับการบันทึกวิดีโอ');return}
  const k=S.expRes/EXH;
  exC=document.createElement('canvas');exC.width=Math.round(EXW*k);exC.height=Math.round(EXH*k);exG=exC.getContext('2d');exC.k=k;
  const chunks=[],stream=exC.captureStream(30);
  adest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  let r;
  try{r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:S.expRes>=1080?10e6:6e6,audioBitsPerSecond:192000})}
  catch(e){toast('เริ่มบันทึกวิดีโอไม่ได้');return}
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const fname=exFname();
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.onstop=()=>{
    if(exCancel){exCancel=false;return}
    const blob=new Blob(chunks,{type:mime.split(';')[0]});
    const a=document.createElement('a'),u=URL.createObjectURL(blob);
    a.href=u;a.download=fname+'.'+ext;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    setExpUi('ส่งออกเสร็จแล้ว: '+fname+'.'+ext,false);
    toast(ext==='mp4'?'ส่งออก MP4 สำเร็จ':'เบราว์เซอร์นี้บันทึกเป็น WebM ได้เท่านั้น (ใช้ Chrome/Edge/Safari รุ่นใหม่เพื่อได้ MP4)');
  };
  audio.pause();audio.currentTime=0;
  rec=r;exCancel=false;exStart=performance.now();
  applyVol();
  r.start(1000);setExpUi('กำลังบันทึก… 0%',true,0);
  play();
}

  initAudio();

  const ch=Math.min(2,buf.numberOfChannels),sr=buf.sampleRate;
  const vcfg={codec:'avc1.640028',width:w,height:h,bitrate:S.expRes>=1080?10e6:6e6,framerate:30};
  const acfg={codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:ch,bitrate:192000};
  const [vs,as]=await Promise.all([VideoEncoder.isConfigSupported(vcfg),AudioEncoder.isConfigSupported(acfg)]);
  if(!vs.supported||!as.supported)return false;
  const target=new Mp4Muxer.ArrayBufferTarget();
  const mux=new Mp4Muxer.Muxer({target,video:{codec:'avc',width:w,height:h},audio:{codec:'aac',numberOfChannels:ch,sampleRate:sr},fastStart:'in-memory'});
  const ve=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>console.error(e)});
  const ae=new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>console.error(e)});
  ve.configure(vcfg);ae.configure(acfg);
  exC=document.createElement('canvas');exC.width=w;exC.height=h;exG=exC.getContext('2d');exC.k=k;
  const r={wc:true,ve,ae,mux,target,fname:exFname(),last:-1,n:0,cancel:false};
  r.audioP=(async()=>{
    const N=buf.length,step=4096,pl=[];for(let c=0;c<ch;c++)pl.push(buf.getChannelData(c));
    for(let o=0;o<N&&!r.cancel;o+=step){
      const n=Math.min(step,N-o),d=new Float32Array(n*ch);
      for(let c=0;c<ch;c++)d.set(pl[c].subarray(o,o+n),c*n);
      const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(o/sr*1e6),data:d});
      ae.encode(ad);ad.close();
      while(ae.encodeQueueSize>30&&!r.cancel)await new Promise(z=>setTimeout(z,5));
    }
  })().catch(()=>{});
  audio.pause();audio.currentTime=0;
  rec=r;exStart=performance.now();applyVol();
  setExpUi('กำลังบันทึก… 0%',true,0);
  play();
  return true;
}
function pushFrame(){
  const r=rec,t=audio.currentTime;
  if(!r||t-r.last<1/30-.002||r.ve.encodeQueueSize>8)return;
  r.last=t;
  const f=new VideoFrame(exC,{timestamp:Math.round(t*1e6)});
  r.ve.encode(f,{keyFrame:r.n++%90===0});f.close();
}
async function finishWC(r){
  try{
    await r.audioP;await r.ve.flush();await r.ae.flush();r.mux.finalize();
    const u=URL.createObjectURL(new Blob([r.target.buffer],{type:'video/mp4'}));
    const a=document.createElement('a');a.href=u;a.download=r.fname+'.mp4';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    setExpUi('ส่งออกเสร็จแล้ว: '+r.fname+'.mp4',false);
    toast('ส่งออก MP4 สำเร็จ (เลื่อนคลิปได้ปกติ)');
  }catch(e){console.error(e);setExpUi('ส่งออกไม่สำเร็จ',false);toast('ส่งออกไม่สำเร็จ ลองใหม่อีกครั้ง')}
}
async function startExport(){
  if(rec){stopExport(false);return}
  if(exBusy)return;
  if(!audio.getAttribute('src')||!curFile){toast('กรุณาเลือกไฟล์เสียงก่อนส่งออก');return}
  if(window.VideoEncoder&&window.AudioEncoder&&window.AudioData&&window.VideoFrame&&window.Mp4Muxer){
    exBusy=true;exStart=performance.now();setExpUi('กำลังเตรียมไฟล์…',true,0,0);
    let ok=false;try{ok=await startExportWC()}catch(e){console.error(e)}
    exBusy=false;
    if(ok)return;
    setExpUi('',false);
  }
  startExportMR();
}
function stopExport(save){
  const r=rec;if(!r)return;
  rec=null;clearTimeout(exTimer);applyVol();
  if(r.wc){
    r.cancel=!save;
    if(save)finishWC(r);
    else{try{r.ve.close();r.ae.close()}catch(e){}setExpUi('ยกเลิกการส่งออกแล้ว',false);audio.pause()}
    return;
  }
  exCancel=!save;
  if(r.state!=='inactive')r.stop();
  if(!save){setExpUi('ยกเลิกการส่งออกแล้ว',false);audio.pause()}
}
audio.addEventListener('ended',()=>{
  if(!rec)return;
  setExpUi('กำลังบันทึกไฟล์…',true,100,2);
  exTimer=setTimeout(()=>stopExport(true),400);
});
audio.addEventListener('pause',()=>{
  if(rec&&performance.now()-exStart>1200&&!audio.ended&&!(isFinite(audio.duration)&&audio.currentTime>=audio.duration-.05))stopExport(false);
});
document.querySelectorAll('.expBtn').forEach(b=>b.onclick=startExport);
$('expCancel').onclick=()=>stopExport(false);

function frame(){
  requestAnimationFrame(frame);
  updTime();
  if(analyser)analyser.getByteFrequencyData(freq);else freq.fill(0);
  const bass=bassLevel();env=bass>env?bass:env*.9;
  const n=S.bars,K=S.mirror?Math.ceil(n/2):n,vals=bins(K),V=new Float32Array(n),T=new Float32Array(n);
  for(let j=0;j<n;j++){const k=S.mirror?(j<K?K-1-j:j-K):j,kk=Math.min(k,K-1);V[j]=vals[kk];T[j]=kk/Math.max(1,K-1)}
  if(S.spin)rot+=.003;
  const data={V,T,bass:env,t:performance.now()/1000,pulse:pulseNow()};
  paint(g0,W,H,data,0);
  if(rec&&exG){paint(exG,EXW,EXH,data,exC.k);if(rec.wc)pushFrame()}
}
frame();
})();
</script>
