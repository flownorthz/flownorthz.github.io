<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overflow Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0a14;
    --ink-deep:#131022;
    --panel:#1f1a36;
    --panel-light:#2a2347;
    --pink:#ff3f8b;
    --pink-glow:rgba(255,63,139,.5);
    --cyan:#2dd9f0;
    --cyan-glow:rgba(45,217,240,.45);
    --yellow:#ffc93d;
    --yellow-glow:rgba(255,201,61,.45);
    --green:#6ee7a0;
    --green-glow:rgba(110,231,160,.4);
    --white:#f5f2ff;
    --dim:rgba(245,242,255,.55);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Kanit',sans-serif;
    color:var(--white);
    background:
      radial-gradient(circle at 50% -10%, #2c2454 0%, #15101f 55%, #0a0810 100%);
    position:relative;
    padding:24px 14px 60px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    mix-blend-mode:overlay;
    opacity:.5;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .cabinet{
    position:relative;
    max-width:880px;
    margin:24px auto 0;
    padding:30px clamp(16px,4vw,42px) 34px;
    background:linear-gradient(180deg,#221c3c,#120f1f);
    border-radius:24px;
    border:1px solid rgba(255,255,255,.07);
    box-shadow:
      0 30px 70px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(255,255,255,.03);
  }

  /* marquee */
  .bulbs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:18px;
  }
  .bulbs span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 6px var(--yellow);
    animation:blink 2.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.18;}
    50%{opacity:1;}
  }

  .eyebrow{
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    letter-spacing:.25em;
    color:var(--dim);
    margin:0 0 10px;
  }

  .title{
    margin:0;
    text-align:center;
    font-family:'Chonburi',cursive;
    font-size:clamp(2.1rem,8vw,3.3rem);
    line-height:1.05;
    letter-spacing:.02em;
    color:var(--white);
    text-shadow:
      0 0 6px rgba(255,255,255,.5),
      0 0 26px var(--pink-glow),
      0 0 50px var(--cyan-glow);
  }
  .title span{
    display:block;
    font-size:.62em;
    color:var(--yellow);
    text-shadow:0 0 18px var(--yellow-glow);
  }

  .subtitle{
    text-align:center;
    margin:14px 0 0;
    font-size:.98rem;
    color:var(--dim);
  }

  main{margin-top:34px;}

  .row{margin-bottom:34px;}
  .row:last-of-type{margin-bottom:0;}

  .section-label{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.04em;
    margin:0 0 14px;
    color:var(--white);
  }
  .section-label .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--c);
    box-shadow:0 0 9px var(--c);
    flex-shrink:0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:14px;
  }

  .cartridge{
    --accent:var(--cyan);
    --glow:var(--cyan-glow);
    appearance:none;
    border:1.5px solid rgba(255,255,255,.08);
    border-radius:12px 12px 5px 5px;
    background:linear-gradient(165deg,var(--panel-light),var(--panel) 70%);
    color:var(--white);
    font-family:inherit;
    text-align:center;
    cursor:pointer;
    padding:18px 10px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    box-shadow:
      0 6px 0 rgba(0,0,0,.45),
      0 9px 16px rgba(0,0,0,.35);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    text-decoration:none;
  }
  .cartridge::before{
    content:"";
    display:block;
    width:56%;
    height:6px;
    margin:0 auto 10px;
    border-radius:3px;
    background:var(--accent);
    box-shadow:0 0 12px var(--glow);
  }
  .cartridge .serial{
    font-family:'Space Mono',monospace;
    font-size:.62rem;
    letter-spacing:.08em;
    color:rgba(245,242,255,.4);
  }
  .cartridge .icon{
    font-size:1.9rem;
    line-height:1;
    margin:2px 0 2px;
  }
  .cartridge .label{
    font-size:.86rem;
    font-weight:500;
    line-height:1.3;
  }

  .cartridge:hover{
    transform:translateY(-5px);
    border-color:rgba(255,255,255,.18);
    box-shadow:
      0 11px 0 rgba(0,0,0,.45),
      0 18px 26px rgba(0,0,0,.4),
      0 0 26px var(--glow);
  }
  .cartridge:active{
    transform:translateY(2px);
    box-shadow:
      0 2px 0 rgba(0,0,0,.45),
      0 4px 10px rgba(0,0,0,.3);
  }
  .cartridge:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:3px;
  }

  .coin-hint{
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    letter-spacing:.1em;
    color:var(--dim);
    margin:-6px 0 14px;
  }

  .footer-strip{
    text-align:center;
    margin-top:36px;
    padding-top:18px;
    border-top:1px dashed rgba(255,255,255,.1);
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    letter-spacing:.12em;
    color:var(--dim);
  }

  @media (prefers-reduced-motion:reduce){
    .bulbs span{animation:none;opacity:.7;}
    .cartridge{transition:none;}
  }
</style>
</head>
<body>

  <div class="cabinet">
    <div class="bulbs" id="bulbs" aria-hidden="true"></div>
    <p class="eyebrow">— PORTFOLIO ARCADE —</p>
    <h1 class="title">OVERFLOW<span>ZONE</span></h1>
    <p class="subtitle">เลือกผลงานไปเล่นกันเลยย ✦ กดปุ่มเพื่อเริ่ม</p>

    <main>

      <section class="row">
        <h2 class="section-label"><span class="dot" style="--c:var(--pink)"></span>เกม</h2>
        <div class="grid">
          <button class="cartridge" style="--accent:var(--pink);--glow:var(--pink-glow)" onclick="window.location.href='Ohana Game.html'">
            <span class="serial">OZ-01</span>
            <span class="icon">🃏</span>
            <span class="label">เกมการ์ดโอฮาน่า</span>
          </button>
          <button class="cartridge" style="--accent:var(--cyan);--glow:var(--cyan-glow)" onclick="window.location.href='KhumThongChume.html'">
            <span class="serial">OZ-02</span>
            <span class="icon">🔠</span>
            <span class="label">เกมคำต้องเชื่อม</span>
          </button>
          <button class="cartridge" style="--accent:var(--yellow);--glow:var(--yellow-glow)" onclick="window.location.href='Bodrongtod.html'">
            <span class="serial">OZ-03</span>
            <span class="icon">🎲</span>
            <span class="label">สุ่มบทลงโทษ</span>
          </button>
          <button class="cartridge" style="--accent:var(--green);--glow:var(--green-glow)" onclick="window.location.href='PueanTaeBook.html'">
            <span class="serial">OZ-04</span>
            <span class="icon">📔</span>
            <span class="label">หนังสือเพื่อนแท้</span>
          </button>
          <button class="cartridge" style="--accent:var(--pink);--glow:var(--pink-glow)" onclick="window.location.href='Birthday.html'">
            <span class="serial">OZ-05</span>
            <span class="icon">🎂</span>
            <span class="label">ทายวันเกิด</span>
          </button>
          <button class="cartridge" style="--accent:var(--cyan);--glow:var(--cyan-glow)" onclick="window.location.href='Crush.html'">
            <span class="serial">OZ-06</span>
            <span class="icon">💌</span>
            <span class="label">มาเป็นหวานใจกันมั้ย?</span>
          </button>
        </div>
      </section>

      <section class="row">
        <h2 class="section-label"><span class="dot" style="--c:var(--cyan)"></span>เครื่องมือ</h2>
        <div class="grid">
          <button class="cartridge" style="--accent:var(--yellow);--glow:var(--yellow-glow)" onclick="window.location.href='Clock.html'">
            <span class="serial">OZ-07</span>
            <span class="icon">⏰</span>
            <span class="label">นาฬิกา?</span>
          </button>
          <button class="cartridge" style="--accent:var(--green);--glow:var(--green-glow)" onclick="window.location.href='transkeyboard.html'">
            <span class="serial">OZ-08</span>
            <span class="icon">⌨️</span>
            <span class="label">แปลงข้อความลืมเปลี่ยนภาษา</span>
          </button>
          <button class="cartridge" style="--accent:var(--pink);--glow:var(--pink-glow)" onclick="window.location.href='textboard.html'">
            <span class="serial">OZ-09</span>
            <span class="icon">🗒️</span>
            <span class="label">บอร์ดข้อความ</span>
          </button>
          <button class="cartridge" style="--accent:var(--cyan);--glow:var(--cyan-glow)" onclick="window.location.href='transflow.html'">
            <span class="serial">OZ-10</span>
            <span class="icon">🗂️</span>
            <span class="label">แปลงไฟล์</span>
          </button>
          <button class="cartridge" style="--accent:var(--yellow);--glow:var(--yellow-glow)" onclick="window.location.href='uselesslever.html'">
            <span class="serial">OZ-11</span>
            <span class="icon">🎚️</span>
            <span class="label">คันโยกโง่เง่า</span>
          </button>
          <button class="cartridge" style="--accent:var(--green);--glow:var(--green-glow)" onclick="window.location.href='findfreetime.html'">
            <span class="serial">OZ-12</span>
            <span class="icon">🗓️</span>
            <span class="label">หาวันว่าง</span>
          </button>
        </div>
      </section>

      <section class="row">
        <h2 class="section-label"><span class="dot" style="--c:var(--yellow)"></span>ติดตามเรา</h2>
        <p class="coin-hint">[ หยอดเหรียญเพื่อเล่นต่อ ]</p>
        <div class="grid">
          <a class="cartridge" style="--accent:var(--pink);--glow:var(--pink-glow)" href="https://www.youtube.com/@OverflowRightNow" target="_blank" rel="noopener noreferrer">
            <span class="icon">▶️</span>
            <span class="label">YouTube<br>Overflow Official</span>
          </a>
          <a class="cartridge" style="--accent:var(--cyan);--glow:var(--cyan-glow)" href="https://www.youtube.com/@LoytasacOfficial" target="_blank" rel="noopener noreferrer">
            <span class="icon">▶️</span>
            <span class="label">YouTube<br>Loytasac</span>
          </a>
          <a class="cartridge" style="--accent:var(--yellow);--glow:var(--yellow-glow)" href="https://www.instagram.com/_pxnsrn_/" target="_blank" rel="noopener noreferrer">
            <span class="icon">📷</span>
            <span class="label">Instagram<br>_pxnsrn_</span>
          </a>
        </div>
      </section>

    </main>

    <p class="footer-strip">© OVERFLOW ZONE — PRESS START</p>
  </div>

<script>
  const bulbRow = document.getElementById('bulbs');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.style.animationDelay = (i * 0.1) + 's';
    bulbRow.appendChild(s);
  }
</script>
</body>
</html>
