<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorldClock - Made by Overflow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000000;
            color: #00ff66;

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }

        /* =========================
           CLOCK
        ========================= */

        .clock-wrapper {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        #clock {
            font-size: 15vw;

            font-weight: 700;

            line-height: 1;

            white-space: nowrap;

            color: #00ff66;

            -webkit-text-stroke: 2px #000000;

            text-shadow:
                0 0 10px rgba(0, 255, 102, 0.15);

            letter-spacing: 0em;

            user-select: none;
        }

        /* =========================
           MADE BY OVERFLOW
        ========================= */

        .credit {
            position: fixed;

            bottom: 250px;
            left: 50%;

            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.35);

            font-size: 60px;

            letter-spacing: 0.08em;

            white-space: nowrap;

            user-select: none;

            pointer-events: none;
        }

        /* =========================
           SETTINGS BUTTON
        ========================= */

        .settings-button {
            position: fixed;

            top: 20px;
            right: 20px;

            width: 46px;
            height: 46px;

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 50%;

            background: rgba(20,20,20,0.8);

            color: white;

            font-size: 22px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;

            z-index: 1000;
        }

        .settings-button:hover {
            transform: rotate(45deg);

            background: rgba(50,50,50,0.95);
        }

        /* =========================
           SETTINGS PANEL
        ========================= */

        .settings-panel {
            position: fixed;

            top: 75px;
            right: 20px;

            width: 330px;

            max-width: calc(100vw - 40px);

            padding: 20px;

            background: rgba(15,15,15,0.96);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 14px;

            color: white;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);

            opacity: 0;

            visibility: hidden;

            transform: translateY(-10px);

            transition: 0.2s;

            z-index: 999;
        }

        .settings-panel.active {
            opacity: 1;

            visibility: visible;

            transform: translateY(0);
        }

        .settings-panel h2 {
            margin: 0 0 18px;

            font-size: 20px;
        }

        /* =========================
           SETTING
        ========================= */

        .setting {
            margin-bottom: 17px;
        }

        .setting label {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 8px;

            font-size: 13px;
        }

        .value {
            opacity: 0.65;
        }

        select,
        input[type="range"],
        input[type="color"] {
            width: 100%;
        }

        select {
            height: 38px;

            padding: 0 10px;

            border-radius: 8px;

            border: 1px solid #333;

            background: #222;

            color: white;

            outline: none;
        }

        input[type="range"] {
            accent-color: #00ff66;

            cursor: pointer;
        }

        input[type="color"] {
            height: 38px;

            padding: 2px;

            border: 1px solid #333;

            border-radius: 8px;

            background: #222;

            cursor: pointer;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            gap: 8px;

            margin-top: 20px;
        }

        .buttons button {
            flex: 1;

            height: 38px;

            border: 1px solid #333;

            border-radius: 8px;

            background: #222;

            color: white;

            cursor: pointer;
        }

        .buttons button:hover {
            background: #333;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #clock {
                font-size: 13vw;
            }

            .settings-panel {
                top: 70px;

                right: 10px;

                width: calc(100vw - 20px);
            }

            .settings-button {
                top: 12px;

                right: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- CLOCK -->

    <div class="clock-wrapper">

        <div id="clock">
            00:00:00
        </div>

    </div>


    <!-- CREDIT -->

    <div class="credit">
        Made by Overflow
    </div>


    <!-- SETTINGS BUTTON -->

    <button
        class="settings-button"
        id="settings-button"
        title="Settings"
    >
        ⚙
    </button>


    <!-- SETTINGS PANEL -->

    <div
        class="settings-panel"
        id="settings-panel"
    >

        <h2>
            Clock Settings
        </h2>


        <!-- TIME ZONE -->

        <div class="setting">

            <label>
                <span>
                    Time Zone
                </span>
            </label>

            <select id="timezone">

                <option value="Asia/Bangkok">
                    Bangkok
                </option>

                <option value="Asia/Tokyo">
                    Tokyo
                </option>

                <option value="Asia/Seoul">
                    Seoul
                </option>

                <option value="Asia/Shanghai">
                    Shanghai
                </option>

                <option value="Asia/Hong_Kong">
                    Hong Kong
                </option>

                <option value="Asia/Singapore">
                    Singapore
                </option>

                <option value="Asia/Kolkata">
                    Mumbai / New Delhi
                </option>

                <option value="Asia/Dubai">
                    Dubai
                </option>

                <option value="Europe/London">
                    London
                </option>

                <option value="Europe/Paris">
                    Paris
                </option>

                <option value="Europe/Berlin">
                    Berlin
                </option>

                <option value="America/New_York">
                    New York
                </option>

                <option value="America/Chicago">
                    Chicago
                </option>

                <option value="America/Denver">
                    Denver
                </option>

                <option value="America/Los_Angeles">
                    Los Angeles
                </option>

                <option value="America/Sao_Paulo">
                    São Paulo
                </option>

                <option value="Australia/Sydney">
                    Sydney
                </option>

                <option value="Pacific/Auckland">
                    Auckland
                </option>

            </select>

        </div>


        <!-- NUMBER SIZE -->

        <div class="setting">

            <label>

                <span>
                    Number Size
                </span>

                <span
                    class="value"
                    id="size-value"
                >
                    15vw
                </span>

            </label>

            <input
                type="range"
                id="size"
                min="5"
                max="30"
                step="0.5"
                value="15"
            >

        </div>


        <!-- NUMBER SPACING -->

        <div class="setting">

            <label>

                <span>
                    Number Spacing
                </span>

                <span
                    class="value"
                    id="spacing-value"
                >
                    0em
                </span>

            </label>

            <input
                type="range"
                id="spacing"
                min="-0.10"
                max="0.30"
                step="0.01"
                value="0"
            >

        </div>


        <!-- TEXT COLOR -->

        <div class="setting">

            <label>

                <span>
                    Text Color
                </span>

            </label>

            <input
                type="color"
                id="text-color"
                value="#00ff66"
            >

        </div>


        <!-- STROKE COLOR -->

        <div class="setting">

            <label>

                <span>
                    Stroke Color
                </span>

            </label>

            <input
                type="color"
                id="stroke-color"
                value="#000000"
            >

        </div>


        <!-- STROKE WIDTH -->

        <div class="setting">

            <label>

                <span>
                    Stroke Width
                </span>

                <span
                    class="value"
                    id="stroke-value"
                >
                    2px
                </span>

            </label>

            <input
                type="range"
                id="stroke"
                min="0"
                max="15"
                step="1"
                value="2"
            >

        </div>


        <!-- BACKGROUND -->

        <div class="setting">

            <label>

                <span>
                    Background Color
                </span>

            </label>

            <input
                type="color"
                id="background-color"
                value="#000000"
            >

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button id="reset">
                Reset
            </button>

            <button id="fullscreen">
                Fullscreen
            </button>

        </div>

    </div>


    <script>

        /* =========================
           DEFAULT SETTINGS
        ========================= */

        const DEFAULTS = {

            timezone: "Asia/Bangkok",

            size: 15,

            letterSpacing: 0,

            textColor: "#00ff66",

            strokeColor: "#000000",

            strokeWidth: 2,

            backgroundColor: "#000000"

        };


        /* =========================
           LOAD SETTINGS
        ========================= */

        let currentSettings =
            JSON.parse(
                localStorage.getItem(
                    "worldClockSettings"
                )
            ) || {
                ...DEFAULTS
            };


        /* =========================
           ELEMENTS
        ========================= */

        const clock =
            document.getElementById(
                "clock"
            );

        const settingsButton =
            document.getElementById(
                "settings-button"
            );

        const settingsPanel =
            document.getElementById(
                "settings-panel"
            );

        const timezone =
            document.getElementById(
                "timezone"
            );

        const size =
            document.getElementById(
                "size"
            );

        const sizeValue =
            document.getElementById(
                "size-value"
            );

        const spacing =
            document.getElementById(
                "spacing"
            );

        const spacingValue =
            document.getElementById(
                "spacing-value"
            );

        const textColor =
            document.getElementById(
                "text-color"
            );

        const strokeColor =
            document.getElementById(
                "stroke-color"
            );

        const stroke =
            document.getElementById(
                "stroke"
            );

        const strokeValue =
            document.getElementById(
                "stroke-value"
            );

        const backgroundColor =
            document.getElementById(
                "background-color"
            );

        const resetButton =
            document.getElementById(
                "reset"
            );

        const fullscreenButton =
            document.getElementById(
                "fullscreen"
            );


        /* =========================
           APPLY SETTINGS
        ========================= */

        function applySettings() {

            timezone.value =
                currentSettings.timezone;

            size.value =
                currentSettings.size;

            spacing.value =
                currentSettings.letterSpacing;

            textColor.value =
                currentSettings.textColor;

            strokeColor.value =
                currentSettings.strokeColor;

            stroke.value =
                currentSettings.strokeWidth;

            backgroundColor.value =
                currentSettings.backgroundColor;


            /* NUMBER SIZE */

            clock.style.fontSize =
                currentSettings.size +
                "vw";


            /* NUMBER SPACING */

            clock.style.letterSpacing =
                currentSettings.letterSpacing +
                "em";


            /* TEXT COLOR */

            clock.style.color =
                currentSettings.textColor;


            /* TEXT STROKE */

            clock.style.webkitTextStroke =
                currentSettings.strokeWidth +
                "px " +
                currentSettings.strokeColor;


            /* BACKGROUND */

            document.body.style.backgroundColor =
                currentSettings.backgroundColor;


            /* VALUES */

            sizeValue.textContent =
                currentSettings.size +
                "vw";

            spacingValue.textContent =
                currentSettings.letterSpacing
                    .toFixed(2) +
                "em";

            strokeValue.textContent =
                currentSettings.strokeWidth +
                "px";

        }


        /* =========================
           SAVE SETTINGS
        ========================= */

        function saveSettings() {

            localStorage.setItem(
                "worldClockSettings",

                JSON.stringify(
                    currentSettings
                )
            );

        }


        /* =========================
           UPDATE CLOCK
        ========================= */

        function updateClock() {

            const now =
                new Date();


            const timeString =
                new Intl.DateTimeFormat(
                    "en-GB",
                    {

                        timeZone:
                            currentSettings.timezone,

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit",

                        hour12:
                            false

                    }
                ).format(now);


            /*
                Force display:

                00:00:00

                ไม่มีช่องว่าง
            */

            const parts =
                timeString.split(":");


            if (parts.length >= 3) {

                clock.textContent =
                    parts[0] +
                    ":" +
                    parts[1] +
                    ":" +
                    parts[2];

            } else {

                clock.textContent =
                    timeString;

            }

        }


        /* =========================
           SETTINGS BUTTON
        ========================= */

        settingsButton.addEventListener(
            "click",
            () => {

                settingsPanel.classList.toggle(
                    "active"
                );

            }
        );


        /* =========================
           TIME ZONE
        ========================= */

        timezone.addEventListener(
            "change",
            () => {

                currentSettings.timezone =
                    timezone.value;

                saveSettings();

                updateClock();

            }
        );


        /* =========================
           NUMBER SIZE
        ========================= */

        size.addEventListener(
            "input",
            () => {

                currentSettings.size =
                    Number(size.value);

                clock.style.fontSize =
                    currentSettings.size +
                    "vw";

                sizeValue.textContent =
                    currentSettings.size +
                    "vw";

                saveSettings();

            }
        );


        /* =========================
           NUMBER SPACING
        ========================= */

        spacing.addEventListener(
            "input",
            () => {

                currentSettings.letterSpacing =
                    Number(spacing.value);

                clock.style.letterSpacing =
                    currentSettings.letterSpacing +
                    "em";

                spacingValue.textContent =
                    currentSettings
                        .letterSpacing
                        .toFixed(2) +
                    "em";

                saveSettings();

            }
        );


        /* =========================
           TEXT COLOR
        ========================= */

        textColor.addEventListener(
            "input",
            () => {

                currentSettings.textColor =
                    textColor.value;

                clock.style.color =
                    currentSettings.textColor;

                saveSettings();

            }
        );


        /* =========================
           STROKE COLOR
        ========================= */

        strokeColor.addEventListener(
            "input",
            () => {

                currentSettings.strokeColor =
                    strokeColor.value;

                clock.style.webkitTextStroke =
                    currentSettings.strokeWidth +
                    "px " +
                    currentSettings.strokeColor;

                saveSettings();

            }
        );


        /* =========================
           STROKE WIDTH
        ========================= */

        stroke.addEventListener(
            "input",
            () => {

                currentSettings.strokeWidth =
                    Number(stroke.value);

                clock.style.webkitTextStroke =
                    currentSettings.strokeWidth +
                    "px " +
                    currentSettings.strokeColor;

                strokeValue.textContent =
                    currentSettings.strokeWidth +
                    "px";

                saveSettings();

            }
        );


        /* =========================
           BACKGROUND COLOR
        ========================= */

        backgroundColor.addEventListener(
            "input",
            () => {

                currentSettings.backgroundColor =
                    backgroundColor.value;

                document.body.style.backgroundColor =
                    currentSettings.backgroundColor;

                saveSettings();

            }
        );


        /* =========================
           RESET
        ========================= */

        resetButton.addEventListener(
            "click",
            () => {

                currentSettings = {
                    ...DEFAULTS
                };

                saveSettings();

                applySettings();

                updateClock();

            }
        );


        /* =========================
           FULLSCREEN
        ========================= */

        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await document
                            .documentElement
                            .requestFullscreen();

                    } else {

                        await document
                            .exitFullscreen();

                    }

                } catch (error) {

                    console.error(error);

                }

            }
        );


        /* =========================
           START
        ========================= */

        applySettings();

        updateClock();

        setInterval(
            updateClock,
            1000
        );

    </script>

</body>
</html>
